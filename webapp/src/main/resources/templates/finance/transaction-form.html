<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editId != null ? 'Edit Transaction' : 'Record New Transaction'}">AgriSmart – Entry Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=DM+Sans:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" th:href="@{/static/finance-module/finance-style.css}">
</head>
<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/finance/home" class="logo" style="text-decoration:none;">
            <div class="logo-icon"><i class="ph ph-leaf"></i></div>
            <div>
                <div style="font-family:'Outfit',sans-serif;font-size:1.25rem;font-weight:600;color:#243327;letter-spacing:-.02em;">AgriSmart</div>
                <div class="logo-sub">Finance Module</div>
            </div>
        </a>
        <nav class="nav-menu">
            <a href="/finance/home" class="nav-link"><i class="ph ph-squares-four"></i> Dashboard</a>
            <a th:href="@{/finance/transactions(farmerId=${farmerId},plotId=${plotId})}" class="nav-link active"><i class="ph ph-arrows-left-right"></i> Transactions</a>
            <a th:href="@{/finance/reports(farmerId=${farmerId},plotId=${plotId})}" class="nav-link"><i class="ph ph-chart-pie-slice"></i> Financial Reports</a>
            <div style="margin-top:auto; padding-top:2rem;">
                <div class="logo-sub" style="margin-bottom:0.5rem; padding-left:1rem;">Account</div>
                <form th:action="@{/logout}" method="post" style="display:contents;">
                    <button type="submit" class="nav-link" style="width:100%; border:none; background:none; cursor:pointer; color:var(--color-red);">
                        <i class="ph ph-sign-out"></i> Logout
                    </button>
                </form>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="top-header">
            <div class="top-header-left">
                <div class="topbar-title" th:text="${editId != null ? 'Edit Transaction Record' : 'Log New Financial Activity'}">Log Entry</div>
                <div class="topbar-sub">
                    <div class="live-dot"></div>
                    <span class="topbar-sub-text">Accounting Integrity Control</span>
                </div>
            </div>
            <div class="user-profile">
                <div class="user-info" style="text-align:right; margin-right:1rem;">
                    <div style="font-size:0.85rem; font-weight:600; color:var(--text-main);" th:text="${farmerName}">Asset Manager</div>
                    <div style="font-size:0.7rem; font-weight:500; color:var(--text-light);">Finance Specialist</div>
                </div>
                <img th:src="'https://ui-avatars.com/api/?name=' + ${farmerName} + '&background=42944A&color=fff'" alt="Profile" class="avatar">
            </div>
        </header>

        <main class="page-content" style="max-width: 800px;">

            <div style="margin-bottom:2.5rem;">
                <a th:href="@{/finance/transactions(farmerId=${farmerId},plotId=${plotId})}" style="display:inline-flex; align-items:center; gap:0.5rem; color:var(--text-muted); text-decoration:none; font-size:0.9rem; margin-bottom:1rem; font-weight:500;">
                    <i class="ph ph-arrow-left"></i> Back to Audit Log
                </a>
                <h1 style="font-size:1.75rem;"><i class="ph ph-note-pencil" style="color:var(--primary); margin-right:0.5rem;"></i> Entry Details</h1>
                <p style="color:var(--text-muted);">Please provide comprehensive details regarding the financial activity for maintaining ledger accuracy.</p>
            </div>

            <div class="content-panel">
                <form th:action="@{${formAction}}" method="post" th:object="${transaction}">
                    
                    <input type="hidden" th:field="*{managerId}"/>
                    <input type="hidden" th:field="*{plotId}"/>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem;">
                        <div class="form-group">
                            <label class="form-label">Transaction Type</label>
                            <select class="form-control" th:field="*{category}" required>
                                <option value="Income">Revenue / Income</option>
                                <option value="Expense">Operational / Expense</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Service Date</label>
                            <input type="date" class="form-control" th:field="*{transactionDate}" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Total Amount ($)</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}" placeholder="0.00" required/>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Transaction Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Describe the transaction for auditing purposes..." 
                                  maxlength="250" required style="resize:none;"></textarea>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem; margin-top:2rem; padding-top:2rem; border-top:1px solid var(--border-subtle);">
                        <div class="form-group">
                            <label class="form-label">Reference Payroll ID <span style="font-weight:400; color:var(--text-light);">(Optional)</span></label>
                            <input type="number" class="form-control" th:field="*{payrollId}" placeholder="Internal reference..."/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Reference Item ID <span style="font-weight:400; color:var(--text-light);">(Optional)</span></label>
                            <input type="number" class="form-control" th:field="*{itemId}" placeholder="Inventory reference..."/>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem;">
                        <a th:href="@{/finance/transactions(farmerId=${farmerId},plotId=${plotId})}" class="btn btn-outline">Discard Changes</a>
                        <button type="submit" class="btn btn-primary" th:text="${editId != null ? 'Update Record' : 'Confirm Entry'}">Confirm Entry</button>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>

</body>
</html>
